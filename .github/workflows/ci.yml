name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check plugin IDs
        run: scripts/check-plugin-ids.sh

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build FFGL bundles
        run: cmake --build build --config RelWithDebInfo

      - name: Verify build-tree bundles
        run: |
          set -euo pipefail
          scripts/verify-macos-bundle.sh "build/NozzleReceive.bundle"
          scripts/verify-macos-bundle.sh "build/NozzleSend.bundle"

      - name: Prepare package metadata
        id: meta
        shell: bash
        run: |
          repo="${{ github.event.repository.name }}"
          short_sha="${GITHUB_SHA::7}"
          platform="macos"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="${repo}-${GITHUB_REF_NAME}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            base="${repo}-latest-${short_sha}-${platform}"
          else
            base="${repo}-ci-${short_sha}-${platform}"
          fi
          echo "package_root=${base}" >> "$GITHUB_OUTPUT"
          echo "package_name=${base}.zip" >> "$GITHUB_OUTPUT"

      - name: Package release zip
        run: |
          scripts/package-release.sh \
            macos \
            "${{ steps.meta.outputs.package_name }}" \
            "${{ steps.meta.outputs.package_root }}" \
            build

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_root }}
          path: ${{ steps.meta.outputs.package_name }}

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check plugin IDs
        shell: bash
        run: scripts/check-plugin-ids.sh

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build FFGL DLLs
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo

      - name: Verify build-tree DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dllName in @('NozzleReceive.dll', 'NozzleSend.dll')) {
            $dll = Get-ChildItem -Path build -Recurse -File -Filter $dllName |
              Sort-Object -Property FullName |
              Select-Object -First 1
            if ($null -eq $dll) {
              throw "missing $dllName"
            }
            & dumpbin /headers $dll.FullName | Tee-Object -FilePath "$dllName.headers.txt"
            Select-String -Path "$dllName.headers.txt" -Pattern 'DLL' | Select-Object -First 1
            & dumpbin /exports $dll.FullName | Tee-Object -FilePath "$dllName.exports.txt"
            Select-String -Path "$dllName.exports.txt" -Pattern '\bplugMain\b' | Select-Object -First 1
          }

      - name: Prepare package metadata
        id: meta
        shell: bash
        run: |
          repo="${{ github.event.repository.name }}"
          short_sha="${GITHUB_SHA::7}"
          platform="windows-x64"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="${repo}-${GITHUB_REF_NAME}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            base="${repo}-latest-${short_sha}-${platform}"
          else
            base="${repo}-ci-${short_sha}-${platform}"
          fi
          echo "package_root=${base}" >> "$GITHUB_OUTPUT"
          echo "package_name=${base}.zip" >> "$GITHUB_OUTPUT"

      - name: Package release zip
        shell: pwsh
        run: |
          ./scripts/package-release-windows.ps1 `
            -Platform windows `
            -PackageName "${{ steps.meta.outputs.package_name }}" `
            -PackageRoot "${{ steps.meta.outputs.package_root }}" `
            -BuildDir build

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_root }}
          path: ${{ steps.meta.outputs.package_name }}


  verify-windows-package:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify downloaded Windows package exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem -Path release-artifacts -Recurse -File -Filter '*windows-x64.zip' |
            Sort-Object -Property FullName |
            Select-Object -First 1
          if ($null -eq $package) {
            throw 'missing Windows release package artifact'
          }
          Expand-Archive -Path $package.FullName -DestinationPath verify-windows-package
          foreach ($dllName in @('NozzleReceive.dll', 'NozzleSend.dll')) {
            $dll = Get-ChildItem -Path verify-windows-package -Recurse -File -Filter $dllName |
              Sort-Object -Property FullName |
              Select-Object -First 1
            if ($null -eq $dll) {
              throw "missing $dllName in downloaded Windows package"
            }
            & dumpbin /headers $dll.FullName | Tee-Object -FilePath "$dllName.downloaded.headers.txt"
            Select-String -Path "$dllName.downloaded.headers.txt" -Pattern 'DLL' | Select-Object -First 1
            & dumpbin /exports $dll.FullName | Tee-Object -FilePath "$dllName.downloaded.exports.txt"
            Select-String -Path "$dllName.downloaded.exports.txt" -Pattern '\bplugMain\b' | Select-Object -First 1
          }

  release:
    needs: [build-macos, build-windows, verify-windows-package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Verify downloaded packages
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(find release-artifacts -type f -name '*.zip' | sort)

          if [ "${#packages[@]}" -ne 2 ]; then
            printf 'expected 2 release zips, found %s\n' "${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            base="$(basename "$package" .zip)"
            unzip -l "$package" > "${package}.contents.txt"
            grep -F "${base}/NozzleReceive" "${package}.contents.txt"
            grep -F "${base}/NozzleSend" "${package}.contents.txt"
            grep -F "${base}/README.md" "${package}.contents.txt"
            grep -F "${base}/LICENSE" "${package}.contents.txt"
            grep -F "${base}/THIRD-PARTY-NOTICES.md" "${package}.contents.txt"

            rm -rf verify-package
            mkdir -p verify-package
            unzip -q "$package" -d verify-package
            if [[ "$base" == *-macos ]]; then
              scripts/verify-macos-bundle.sh --require-adhoc-signature "verify-package/${base}/NozzleReceive.bundle"
              scripts/verify-macos-bundle.sh --require-adhoc-signature "verify-package/${base}/NozzleSend.bundle"
            elif [[ "$base" == *-windows-x64 ]]; then
              file "verify-package/${base}/NozzleReceive.dll" | tee "${package}.receive.file.txt"
              file "verify-package/${base}/NozzleSend.dll" | tee "${package}.send.file.txt"
              grep -F "PE32+" "${package}.receive.file.txt"
              grep -F "PE32+" "${package}.send.file.txt"
            else
              echo "unknown package platform: $base" >&2
              exit 1
            fi
            printf '%s\n' "$package" >> packages.txt
          done

      - name: Delete old latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete latest --yes --repo "${GITHUB_REPOSITORY}"
          else
            echo "No existing latest release to delete"
          fi

      - name: Check versioned release asset does not exist
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > existing-assets.txt 2>/dev/null; then
            while IFS= read -r package; do
              asset="$(basename "$package")"
              if grep -Fx "$asset" existing-assets.txt; then
                echo "versioned release asset already exists: $asset" >&2
                exit 1
              fi
            done < packages.txt
          else
            echo "No existing release for ${GITHUB_REF_NAME}; create step will create it."
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < packages.txt

          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            gh release create latest "${packages[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Latest development snapshot" \
              --prerelease \
              --notes "Development snapshot from main. Commit: ${GITHUB_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${packages[@]}" --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "${GITHUB_REF_NAME}" "${packages[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${GITHUB_REF_NAME}" \
                --notes "Release ${GITHUB_REF_NAME}"
            fi
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
