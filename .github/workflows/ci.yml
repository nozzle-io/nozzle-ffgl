name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  ffgl-core-candidate-pair:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      WRAPPER_CANDIDATE: 2f82ec9d6e53779d8b541b5f2379c45798e8ef38
      CORE_CANDIDATE: 497d74ad81cbdd0693c975070dd6430c52d3be94
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WRAPPER_CANDIDATE }}
          submodules: recursive

      - name: Check out candidate core in the disposable build directory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WRAPPER_CANDIDATE"
          echo "FFGL source: $WRAPPER_CANDIDATE"
          echo "Recorded core: $(git rev-parse HEAD:nozzle)"
          git -C nozzle fetch --no-tags origin "$CORE_CANDIDATE"
          git -C nozzle checkout --detach "$CORE_CANDIDATE"
          git -C nozzle submodule update --init --recursive
          test "$(git -C nozzle rev-parse HEAD)" = "$CORE_CANDIDATE"
          echo "Tested core: $CORE_CANDIDATE"

      - name: Render and read back the two published pixels
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --target test_receive_macos --parallel 3
          build/test_receive_macos build/NozzleReceive.bundle/Contents/MacOS/NozzleReceive
